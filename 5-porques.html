<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5 Porqués — Lean Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
      --text:#e6edf3;--muted:#8b949e;--faint:#484f58;
      --accent:#4f98a3;--green:#3fb950;--warn:#d29922;--danger:#f85149;
      --purple:#bc8cff;--orange:#ffa657;
      --radius:12px;--radius-sm:8px;
      --trans:180ms cubic-bezier(.16,1,.3,1);
    }
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

    /* NAV */
    .topnav{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:54px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-shrink:0}
    .brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;text-decoration:none;color:var(--text)}
    .brand-icon{font-family:'Instrument Serif',serif;font-size:22px;color:var(--accent)}
    .nav-links{display:flex;gap:4px}
    .nav-link{padding:6px 13px;border-radius:var(--radius-sm);font-size:13px;color:var(--muted);text-decoration:none;transition:all var(--trans)}
    .nav-link:hover,.nav-link.active{background:var(--surface2);color:var(--text)}
    .nav-actions{display:flex;gap:8px}
    .btn{padding:7px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all var(--trans);font-family:inherit}
    .btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#3a7f8a}
    .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-ghost:hover{background:var(--surface2);color:var(--text)}

    /* PAGE */
    .page{max-width:860px;margin:0 auto;padding:40px 24px 80px;width:100%}
    .page-header{margin-bottom:36px}
    .page-title{font-family:'Instrument Serif',serif;font-size:2rem;margin-bottom:6px}
    .page-sub{font-size:13px;color:var(--muted)}

    /* PROBLEM BOX */
    .problem-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:32px}
    .problem-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
    .problem-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:var(--radius-sm);font-size:15px;font-weight:600;font-family:inherit;outline:none;transition:border-color var(--trans)}
    .problem-input:focus{border-color:var(--accent)}
    .problem-meta{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
    .meta-field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:160px}
    .meta-field label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
    .meta-field input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;outline:none;transition:border-color var(--trans)}
    .meta-field input:focus{border-color:var(--accent)}

    /* WHY CHAIN */
    .why-chain{display:flex;flex-direction:column;gap:0}

    .why-node{position:relative;padding-left:40px}
    .why-node::before{
      content:'';
      position:absolute;
      left:15px;top:52px;
      width:2px;
      bottom:-8px;
      background:linear-gradient(to bottom,var(--node-color,var(--accent)),transparent);
      opacity:.35;
    }
    .why-node:last-child::before{display:none}

    .why-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--node-color,var(--accent));border-radius:var(--radius);padding:16px 20px;margin-bottom:8px;transition:border-color var(--trans),box-shadow var(--trans)}
    .why-card:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--node-color,var(--accent)) 20%,transparent)}

    .why-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .why-badge{width:28px;height:28px;border-radius:50%;background:var(--node-color,var(--accent));color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .why-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--node-color,var(--accent))}
    .why-spacer{flex:1}
    .why-status{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:600}
    .status-filled{background:color-mix(in srgb,var(--node-color,var(--accent)) 15%,transparent);color:var(--node-color,var(--accent))}
    .status-empty{background:var(--surface2);color:var(--faint)}

    .why-textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:var(--radius-sm);font-size:14px;font-family:inherit;outline:none;resize:none;min-height:60px;transition:border-color var(--trans),height var(--trans)}
    .why-textarea:focus{border-color:var(--node-color,var(--accent))}
    .why-textarea::placeholder{color:var(--faint)}

    .why-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;flex-wrap:wrap;gap:8px}
    .why-hint{font-size:11px;color:var(--faint);font-style:italic}
    .why-confirm{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:pointer;user-select:none}
    .why-confirm input{accent-color:var(--node-color,var(--accent))}

    /* CONNECTOR */
    .why-connector{display:flex;align-items:center;gap:8px;padding:0 0 8px 0;margin-left:40px}
    .connector-line{width:2px;height:24px;background:var(--border);flex-shrink:0;margin-left:11px}
    .connector-label{font-size:10px;color:var(--faint);font-style:italic;margin-left:8px}

    /* ROOT CAUSE */
    .root-card{background:color-mix(in srgb,var(--green) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--green) 30%,var(--border));border-radius:var(--radius);padding:20px 24px;margin-top:16px}
    .root-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .root-icon{font-size:20px}
    .root-title{font-size:13px;font-weight:700;color:var(--green)}
    .root-area{width:100%;background:var(--surface2);border:1px solid color-mix(in srgb,var(--green) 25%,var(--border));color:var(--text);padding:10px 12px;border-radius:var(--radius-sm);font-size:14px;font-family:inherit;outline:none;resize:none;min-height:60px;transition:border-color var(--trans)}
    .root-area:focus{border-color:var(--green)}
    .root-actions{margin-top:12px}
    .root-action-row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
    .root-action-row label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
    .root-action-row input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;outline:none;width:100%;transition:border-color var(--trans)}
    .root-action-row input:focus{border-color:var(--green)}

    /* SUMMARY */
    .summary-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-top:28px}
    .summary-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:14px}
    .summary-chain{display:flex;flex-direction:column;gap:6px}
    .summary-row{display:flex;gap:10px;align-items:flex-start}
    .sum-badge{width:20px;height:20px;border-radius:50%;font-size:9px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
    .sum-text{font-size:12px;color:var(--muted);line-height:1.5}
    .sum-text.filled{color:var(--text)}
    .sum-arrow{color:var(--faint);font-size:10px;margin:2px 0 2px 25px}

    /* PROGRESS */
    .progress-bar-wrap{background:var(--surface2);border-radius:99px;height:6px;margin:16px 0 8px;overflow:hidden}
    .progress-bar{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .4s cubic-bezier(.16,1,.3,1)}
    .progress-label{font-size:11px;color:var(--muted);text-align:right}

    /* MULTIPLE ANALYSES */
    .analyses-tabs{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
    .tab-btn{padding:6px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted);transition:all var(--trans);font-family:inherit}
    .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .tab-btn:hover:not(.active){background:var(--surface2);color:var(--text)}
    .tab-add{border-style:dashed;color:var(--faint)}
    .tab-add:hover{border-color:var(--accent);color:var(--accent)}

    @media(max-width:600px){.page{padding:24px 16px 60px}.topnav .nav-links{display:none}}
  </style>
</head>
<body>

<nav class="topnav">
  <a class="brand" href="index.html"><span class="brand-icon">⧡</span><span>Lean <strong>Suite</strong></span></a>
  <div class="nav-links">
    <a class="nav-link" href="index.html">🏠 Inicio</a>
    <a class="nav-link" href="vsm.html">🗺️ VSM</a>
    <a class="nav-link" href="5s.html">🧹 5S</a>
    <a class="nav-link" href="ishikawa.html">🐟 Ishikawa</a>
    <a class="nav-link active" href="5-porques.html">❓ 5 Porqués</a>
    <a class="nav-link" href="caso-negocio.html">📋 Caso</a>
    <a class="nav-link" href="pdca.html">🔄 PDCA</a>
  </div>
  <div class="nav-actions">
    <button class="btn btn-ghost" onclick="newAnalysis()">＋ Nueva</button>
    <button class="btn btn-ghost" onclick="exportCSV()">⬇ CSV</button>
    <button class="btn btn-primary" onclick="exportPDF()">📄 Exportar</button>
  </div>
</nav>

<div class="page">
  <div class="page-header">
    <h1 class="page-title">5 Porqués ❓</h1>
    <p class="page-sub">Drill-down iterativo de causa raíz. Parte del síntoma y pregunta <em>¿por qué?</em> hasta encontrar la causa sistémica.</p>
  </div>

  <!-- TABS -->
  <div class="analyses-tabs" id="tabs-bar"></div>

  <!-- PROBLEMA -->
  <div class="problem-box">
    <div class="problem-label">🔴 Problema / Síntoma observado</div>
    <textarea class="problem-input" id="problem-input" rows="2"
      placeholder="Ej: La máquina CNC-3 paró en mitad del turno..."
      oninput="syncProblem()"></textarea>
    <div class="problem-meta">
      <div class="meta-field"><label>Analista</label><input id="meta-analyst" placeholder="Nombre"></div>
      <div class="meta-field"><label>Área</label><input id="meta-area" placeholder="Producción, Calidad..."></div>
      <div class="meta-field"><label>Fecha</label><input id="meta-date" type="date"></div>
      <div class="meta-field"><label>Turno</label><input id="meta-shift" placeholder="A / B / C"></div>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
  <div class="progress-label" id="progress-label">0 de 5 porqués completados</div>

  <!-- WHY CHAIN -->
  <div class="why-chain" id="why-chain"></div>

  <!-- ROOT CAUSE -->
  <div class="root-card" id="root-card" style="display:none">
    <div class="root-header"><span class="root-icon">🎯</span><span class="root-title">Causa Raíz Identificada</span></div>
    <textarea class="root-area" id="root-cause" rows="3"
      placeholder="Resume la causa raíz sistémica encontrada..."
      oninput="saveState()"></textarea>
    <div class="root-actions">
      <div class="root-action-row"><label>Acción correctiva propuesta</label><input id="root-action" placeholder="Ej: Implementar plan de mantenimiento preventivo mensual..." oninput="saveState()"></div>
      <div class="root-action-row"><label>Responsable</label><input id="root-owner" placeholder="Nombre / Cargo" oninput="saveState()"></div>
      <div class="root-action-row"><label>Fecha compromiso</label><input id="root-deadline" type="date" oninput="saveState()"></div>
    </div>
  </div>

  <!-- SUMMARY -->
  <div class="summary-panel" id="summary-panel" style="display:none">
    <div class="summary-title">📋 Cadena de Causas</div>
    <div class="summary-chain" id="summary-chain"></div>
  </div>

</div>

<script>
// =============================================
// STATE
// =============================================
const WHY_COLORS = ['#4f98a3','#d29922','#bc8cff','#ffa657','#f85149'];
const WHY_PLACEHOLDERS = [
  '¿Por qué ocurrió el problema?',
  '¿Por qué sucedió eso?',
  '¿Por qué pasó esa situación?',
  '¿Por qué se llegó a ese punto?',
  '¿Por qué existe esa condición raíz?',
];

let analyses = [];
let currentIdx = 0;

function newAnalysisObj(id){
  return {
    id,
    name: 'Análisis #'+id,
    problem: '',
    analyst:'', area:'', date: new Date().toISOString().slice(0,10), shift:'',
    whys: ['','','','',''],
    confirmed: [false,false,false,false,false],
    rootCause:'', rootAction:'', rootOwner:'', rootDeadline:''
  };
}

function init(){
  analyses = [newAnalysisObj(1)];
  currentIdx = 0;
  document.getElementById('meta-date').value = analyses[0].date;
  render();
}

function current(){ return analyses[currentIdx]; }

// =============================================
// SYNC INPUTS → STATE
// =============================================
function syncProblem(){
  current().problem = document.getElementById('problem-input').value;
  updateTabName();
  saveState();
}
function syncMeta(){
  current().analyst  = document.getElementById('meta-analyst').value;
  current().area     = document.getElementById('meta-area').value;
  current().date     = document.getElementById('meta-date').value;
  current().shift    = document.getElementById('meta-shift').value;
  saveState();
}
function syncWhy(i, val){
  current().whys[i] = val;
  updateProgress();
  updateSummary();
  saveState();
}
function syncConfirm(i, checked){
  current().confirmed[i] = checked;
  saveState();
}
function syncRoot(){
  current().rootCause    = document.getElementById('root-cause').value;
  current().rootAction   = document.getElementById('root-action').value;
  current().rootOwner    = document.getElementById('root-owner').value;
  current().rootDeadline = document.getElementById('root-deadline').value;
  saveState();
}

// =============================================
// RENDER
// =============================================
function render(){
  renderTabs();
  loadAnalysis(currentIdx);
}

function renderTabs(){
  const bar = document.getElementById('tabs-bar');
  bar.innerHTML = analyses.map((a,i)=>`
    <button class="tab-btn${i===currentIdx?' active':''}" onclick="switchTab(${i})">
      ${a.name}
    </button>
  `).join('') +
  `<button class="tab-btn tab-add" onclick="addTab()">＋ Nueva</button>`;
}

function loadAnalysis(idx){
  const a = analyses[idx];
  document.getElementById('problem-input').value = a.problem;
  document.getElementById('meta-analyst').value  = a.analyst;
  document.getElementById('meta-area').value     = a.area;
  document.getElementById('meta-date').value     = a.date;
  document.getElementById('meta-shift').value    = a.shift;
  renderChain();
  loadRootCard();
  updateProgress();
  updateSummary();
}

function renderChain(){
  const a = current();
  const chain = document.getElementById('why-chain');
  chain.innerHTML = '';

  for(let i=0;i<5;i++){
    const color = WHY_COLORS[i];
    const filled = a.whys[i].trim().length > 0;

    // Connector (except first)
    if(i>0){
      const conn = document.createElement('div');
      conn.className='why-connector';
      conn.innerHTML=`<div class="connector-line"></div><span class="connector-label">porque...</span>`;
      chain.appendChild(conn);
    }

    const node = document.createElement('div');
    node.className='why-node';
    node.style.setProperty('--node-color', color);
    node.innerHTML=`
      <div class="why-card">
        <div class="why-header">
          <div class="why-badge">${i+1}</div>
          <div class="why-title">¿Por qué #${i+1}?</div>
          <div class="why-spacer"></div>
          <div class="why-status ${filled?'status-filled':'status-empty'}">${filled?'✓ Completado':'Pendiente'}</div>
        </div>
        <textarea class="why-textarea" id="why-${i}" placeholder="${WHY_PLACEHOLDERS[i]}"
          oninput="syncWhy(${i},this.value)" rows="2">${escHtml(a.whys[i])}</textarea>
        <div class="why-footer">
          <span class="why-hint">${i===4?'🎯 Esta es la causa raíz sistémica':'Profundiza hasta llegar a la causa sistémica'}</span>
          <label class="why-confirm">
            <input type="checkbox" ${a.confirmed[i]?'checked':''} onchange="syncConfirm(${i},this.checked)"> Validado
          </label>
        </div>
      </div>
    `;
    chain.appendChild(node);
  }

  // Show/hide root card based on last why filled
  const allFilled = a.whys.filter(w=>w.trim()).length >= 3;
  document.getElementById('root-card').style.display = allFilled ? 'block' : 'none';
}

function loadRootCard(){
  const a = current();
  document.getElementById('root-cause').value    = a.rootCause;
  document.getElementById('root-action').value   = a.rootAction;
  document.getElementById('root-owner').value    = a.rootOwner;
  document.getElementById('root-deadline').value = a.rootDeadline;
}

function updateProgress(){
  const a = current();
  const filled = a.whys.filter(w=>w.trim().length>0).length;
  const pct = (filled/5)*100;
  document.getElementById('progress-bar').style.width = pct+'%';
  document.getElementById('progress-label').textContent = `${filled} de 5 porqués completados`;
}

function updateSummary(){
  const a = current();
  const filled = a.whys.filter(w=>w.trim().length>0);
  const panel = document.getElementById('summary-panel');
  if(filled.length < 2){ panel.style.display='none'; return; }
  panel.style.display='block';
  const chain = document.getElementById('summary-chain');
  let html = '';
  if(a.problem.trim()){
    html+=`<div class="summary-row"><div class="sum-badge" style="background:#f85149">P</div><div class="sum-text filled">${escHtml(a.problem)}</div></div>`;
    html+=`<div class="sum-arrow">↓ porque...</div>`;
  }
  a.whys.forEach((w,i)=>{
    if(!w.trim()) return;
    html+=`<div class="summary-row"><div class="sum-badge" style="background:${WHY_COLORS[i]}">${i+1}</div><div class="sum-text filled">${escHtml(w)}</div></div>`;
    if(i < a.whys.filter(x=>x.trim()).length-1) html+=`<div class="sum-arrow">↓ porque...</div>`;
  });
  chain.innerHTML = html;
}

function updateTabName(){
  const a = current();
  if(a.problem.trim()){
    a.name = a.problem.slice(0,28) + (a.problem.length>28?'…':'');
  }
  renderTabs();
}

// =============================================
// TABS
// =============================================
function switchTab(idx){
  currentIdx = idx;
  render();
}
function addTab(){
  const id = analyses.length+1;
  analyses.push(newAnalysisObj(id));
  currentIdx = analyses.length-1;
  render();
}
function newAnalysis(){
  addTab();
}

// =============================================
// EXPORT
// =============================================
function exportCSV(){
  const a = current();
  let csv = `5 Porqués — Reporte\nProblema,"${a.problem}"\nAnalista,"${a.analyst}"\nÁrea,"${a.area}"\nFecha,"${a.date}"\nTurno,"${a.shift}"\n\n#,¿Por qué?,Validado\n`;
  a.whys.forEach((w,i)=>{
    csv += `${i+1},"${w}",${a.confirmed[i]?'Sí':'No'}\n`;
  });
  csv += `\nCausa Raíz,"${a.rootCause}"\nAcción Correctiva,"${a.rootAction}"\nResponsable,"${a.rootOwner}"\nFecha Compromiso,"${a.rootDeadline}"\n`;
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href=url; link.download=`5porques_${(a.problem||'analisis').replace(/\s+/g,'_').slice(0,30)}.csv`; link.click();
  URL.revokeObjectURL(url);
}

function exportPDF(){
  const a = current();
  const win = window.open('','_blank','width=800,height=600');
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
  <title>5 Porqués — ${escHtml(a.problem)}</title>
  <style>
    body{font-family:sans-serif;padding:40px;color:#111;max-width:720px;margin:0 auto}
    h1{font-size:22px;margin-bottom:4px}h2{font-size:14px;color:#555;margin:24px 0 8px;text-transform:uppercase;letter-spacing:.06em}
    .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;font-size:12px;color:#555;margin-bottom:24px}
    .why-row{border-left:3px solid ${WHY_COLORS[0]};padding:10px 14px;margin-bottom:8px;background:#f8f8f8}
    .why-row .num{font-weight:800;font-size:11px;color:#888;margin-bottom:2px}
    .why-row .text{font-size:14px}
    .root{background:#efffef;border:1px solid #8bc34a;padding:14px;border-radius:6px;margin-top:16px}
    @media print{body{padding:20px}}
  </style></head><body>
  <h1>5 Porqués: Análisis de Causa Raíz</h1>
  <div class="meta">
    <div><strong>Problema:</strong> ${escHtml(a.problem)}</div>
    <div><strong>Analista:</strong> ${escHtml(a.analyst)}</div>
    <div><strong>Área:</strong> ${escHtml(a.area)}</div>
    <div><strong>Fecha:</strong> ${a.date}</div>
  </div>
  <h2>Cadena de Porqués</h2>
  ${a.whys.map((w,i)=>`
    <div class="why-row" style="border-left-color:${WHY_COLORS[i]}">
      <div class="num">¿POR QUÉ #${i+1}? ${a.confirmed[i]?'✓':''}</div>
      <div class="text">${escHtml(w)||'—'}</div>
    </div>
  `).join('')}
  ${a.rootCause?`
  <div class="root">
    <strong>🎯 Causa Raíz:</strong><br>${escHtml(a.rootCause)}<br><br>
    <strong>Acción:</strong> ${escHtml(a.rootAction)}<br>
    <strong>Responsable:</strong> ${escHtml(a.rootOwner)} &nbsp; <strong>Fecha:</strong> ${a.rootDeadline}
  </div>`:''}
  <script>window.onload=()=>{window.print();}<\/script>
  </body></html>`);
  win.document.close();
}

function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
