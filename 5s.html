<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoría 5S — Lean Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
      --text:#e6edf3;--muted:#8b949e;--faint:#484f58;
      --accent:#4f98a3;--green:#3fb950;--warn:#d29922;--danger:#f85149;
      --purple:#bc8cff;--orange:#ffa657;
      --s1:#4f98a3;--s2:#3fb950;--s3:#d29922;--s4:#bc8cff;--s5:#ffa657;
      --radius:12px;--radius-sm:8px;
    }
    html{scroll-behavior:smooth}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

    /* NAV */
    .topnav{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:56px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
    .brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;text-decoration:none;color:var(--text)}
    .brand-icon{font-family:'Instrument Serif',serif;font-size:22px;color:var(--accent)}
    .nav-links{display:flex;gap:4px}
    .nav-link{padding:6px 14px;border-radius:var(--radius-sm);font-size:13px;color:var(--muted);cursor:pointer;text-decoration:none;transition:all .18s}
    .nav-link:hover,.nav-link.active{background:var(--surface2);color:var(--text)}
    .nav-actions{display:flex;gap:8px}
    .btn{padding:7px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .18s}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-primary:hover{background:#3a7f8a}
    .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
    .btn-ghost:hover{background:var(--surface2);color:var(--text)}

    /* HEADER INFO */
    .audit-header{max-width:1100px;margin:32px auto 0;padding:0 32px}
    .audit-header h1{font-family:'Instrument Serif',serif;font-size:clamp(1.6rem,3vw,2.4rem);margin-bottom:6px}
    .audit-header h1 em{color:var(--green);font-style:italic}
    .audit-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:20px}
    .meta-field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:160px}
    .meta-field label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
    .meta-field input,.meta-field select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;outline:none;transition:border-color .18s}
    .meta-field input:focus,.meta-field select:focus{border-color:var(--accent)}

    /* SCORE DASHBOARD */
    .score-dash{max-width:1100px;margin:28px auto 0;padding:0 32px}
    .score-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
    .score-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 12px;text-align:center;position:relative;overflow:hidden;transition:border-color .3s}
    .score-card::before{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--c,var(--accent))}
    .score-card.total{background:var(--surface2)}
    .sc-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
    .sc-val{font-size:26px;font-weight:700;color:var(--text);line-height:1}
    .sc-max{font-size:11px;color:var(--faint);margin-top:2px}
    .sc-bar{height:4px;background:var(--surface2);border-radius:99px;margin-top:8px;overflow:hidden}
    .sc-bar-fill{height:100%;background:var(--c,var(--accent));border-radius:99px;transition:width .5s ease}

    /* SECTIONS */
    .audit-body{max-width:1100px;margin:32px auto 80px;padding:0 32px;display:flex;flex-direction:column;gap:32px}

    .s-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
    .s-header{display:flex;align-items:center;gap:14px;padding:18px 24px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;transition:background .18s}
    .s-header:hover{background:var(--surface2)}
    .s-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
    .s-title-group{flex:1}
    .s-name{font-size:15px;font-weight:700}
    .s-kanji{font-size:12px;color:var(--muted);margin-top:1px}
    .s-score-badge{font-size:13px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface2);min-width:60px;text-align:center}
    .s-chevron{color:var(--muted);transition:transform .25s;font-size:14px}
    .s-section.collapsed .s-chevron{transform:rotate(-90deg)}
    .s-body{padding:0}
    .s-section.collapsed .s-body{display:none}

    /* ITEMS */
    .item-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--border);transition:background .15s}
    .item-row:last-child{border-bottom:none}
    .item-row:hover{background:rgba(255,255,255,.02)}
    .item-text{font-size:13px;line-height:1.5}
    .item-note{font-size:11px;color:var(--muted);margin-top:2px}
    .rating-btns{display:flex;gap:4px}
    .r-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center}
    .r-btn:hover{border-color:var(--muted);color:var(--text)}
    .r-btn.active-0{background:rgba(248,81,73,.2);border-color:#f85149;color:#f85149}
    .r-btn.active-1{background:rgba(210,153,34,.2);border-color:#d29922;color:#d29922}
    .r-btn.active-2{background:rgba(255,166,87,.2);border-color:#ffa657;color:#ffa657}
    .r-btn.active-3{background:rgba(79,152,163,.2);border-color:#4f98a3;color:#4f98a3}
    .r-btn.active-4{background:rgba(63,185,80,.2);border-color:#3fb950;color:#3fb950}
    .obs-input{width:160px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:11px;font-family:inherit;outline:none}
    .obs-input:focus{border-color:var(--accent)}

    /* HALLAZGOS */
    .findings-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
    .findings-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:16px}
    .findings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
    .finding-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;display:flex;flex-direction:column;gap:8px}
    .finding-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;width:fit-content}
    .tag-critical{background:rgba(248,81,73,.2);color:#f85149}
    .tag-improvement{background:rgba(210,153,34,.2);color:#d29922}
    .tag-good{background:rgba(63,185,80,.2);color:#3fb950}
    .finding-text{font-size:12px;line-height:1.6;color:var(--text)}
    .finding-s{font-size:11px;color:var(--muted)}
    .empty-findings{color:var(--faint);font-size:13px;text-align:center;padding:24px}

    /* REPORTE */
    .report-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 32px;display:flex;align-items:center;justify-content:space-between;z-index:50}
    .rb-score{display:flex;align-items:center;gap:10px}
    .rb-val{font-size:20px;font-weight:700}
    .rb-lbl{font-size:12px;color:var(--muted)}
    .rb-status{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px}
    .rb-actions{display:flex;gap:8px}

    @media(max-width:700px){
      .score-row{grid-template-columns:repeat(3,1fr)}
      .item-row{grid-template-columns:1fr;gap:8px}
      .obs-input{width:100%}
      .topnav{padding:0 16px}
      .audit-header,.score-dash,.audit-body{padding-left:16px;padding-right:16px}
    }
  </style>
</head>
<body>

<nav class="topnav">
  <a class="brand" href="index.html">
    <span class="brand-icon">⧡</span>
    <span>Lean <strong>Suite</strong></span>
  </a>
  <div class="nav-links">
    <a class="nav-link" href="index.html">🏠 Inicio</a>
    <a class="nav-link" href="vsm.html">🗺️ VSM</a>
    <a class="nav-link active" href="5s.html">🧹 5S</a>
    <a class="nav-link" href="caso-negocio.html">📋 Caso</a>
    <a class="nav-link" href="a3-report.html">📄 A3</a>
    <a class="nav-link" href="pdca.html">🔄 PDCA</a>
  </div>
  <div class="nav-actions">
    <button class="btn btn-ghost" onclick="resetAudit()">🔄 Nueva Auditoría</button>
    <button class="btn btn-primary" onclick="exportCSV()">⬇ Exportar CSV</button>
  </div>
</nav>

<div class="audit-header">
  <h1>Auditoría <em>5S</em></h1>
  <div class="audit-meta">
    <div class="meta-field"><label>Área / Proceso</label><input type="text" id="meta-area" placeholder="Ej: Línea de Ensamble A"></div>
    <div class="meta-field"><label>Auditor</label><input type="text" id="meta-auditor" placeholder="Nombre del auditor"></div>
    <div class="meta-field"><label>Fecha</label><input type="date" id="meta-date"></div>
    <div class="meta-field"><label>Turno</label><select id="meta-turno"><option>Turno 1</option><option>Turno 2</option><option>Turno 3</option><option>Administrativo</option></select></div>
    <div class="meta-field"><label>Planta / Sede</label><input type="text" id="meta-planta" placeholder="Planta o sede"></div>
  </div>
</div>

<div class="score-dash">
  <div class="score-row" id="score-row">
    <div class="score-card" style="--c:var(--s1)" id="sc-s1"><div class="sc-label">1S · Seiri</div><div class="sc-val" id="sv-1">0</div><div class="sc-max">/20 pts</div><div class="sc-bar"><div class="sc-bar-fill" id="sf-1" style="width:0%"></div></div></div>
    <div class="score-card" style="--c:var(--s2)" id="sc-s2"><div class="sc-label">2S · Seiton</div><div class="sc-val" id="sv-2">0</div><div class="sc-max">/20 pts</div><div class="sc-bar"><div class="sc-bar-fill" id="sf-2" style="width:0%"></div></div></div>
    <div class="score-card" style="--c:var(--s3)" id="sc-s3"><div class="sc-label">3S · Seiso</div><div class="sc-val" id="sv-3">0</div><div class="sc-max">/20 pts</div><div class="sc-bar"><div class="sc-bar-fill" id="sf-3" style="width:0%"></div></div></div>
    <div class="score-card" style="--c:var(--s4)" id="sc-s4"><div class="sc-label">4S · Seiketsu</div><div class="sc-val" id="sv-4">0</div><div class="sc-max">/20 pts</div><div class="sc-bar"><div class="sc-bar-fill" id="sf-4" style="width:0%"></div></div></div>
    <div class="score-card" style="--c:var(--s5)" id="sc-s5"><div class="sc-label">5S · Shitsuke</div><div class="sc-val" id="sv-5">0</div><div class="sc-max">/20 pts</div><div class="sc-bar"><div class="sc-bar-fill" id="sf-5" style="width:0%"></div></div></div>
    <div class="score-card total" style="--c:var(--accent)"><div class="sc-label">TOTAL</div><div class="sc-val" id="sv-total">0</div><div class="sc-max">/100 pts</div><div class="sc-bar"><div class="sc-bar-fill" id="sf-total" style="width:0%"></div></div></div>
  </div>
</div>

<div class="audit-body" id="audit-body"></div>

<div class="report-bar">
  <div class="rb-score">
    <div class="rb-val" id="rb-total">0 / 100</div>
    <div class="rb-lbl">Puntuación Total</div>
    <div class="rb-status" id="rb-status" style="background:rgba(72,79,88,.3);color:#8b949e">Sin evaluar</div>
  </div>
  <div class="rb-actions">
    <button class="btn btn-ghost" onclick="scrollToFindings()">🔍 Ver Hallazgos</button>
    <button class="btn btn-primary" onclick="exportCSV()">⬇ Exportar CSV</button>
  </div>
</div>

<script>
const S5_DATA = [
  {
    id:1, name:'Seiri', label:'1S — Clasificar', kanji:'整理 · Separar lo necesario de lo innecesario',
    color:'var(--s1)', emoji:'🔴',
    items:[
      {text:'Solo los materiales necesarios están en el área de trabajo',note:'Verificar herramientas, materiales y equipos'},
      {text:'No hay elementos obsoletos, rotos o en desuso en el área',note:'Buscar en esquinas, cajones y estantes'},
      {text:'Los materiales de uso infrecuente están identificados y separados',note:'Criterio: frecuencia de uso'},
      {text:'Existe un criterio claro para definir "necesario vs. innecesario"',note:'Política o estándar documentado'},
      {text:'Se aplica el sistema de tarjetas rojas (red tagging) activamente',note:'¿Hay área de tarjetas rojas visible?'},
    ]
  },
  {
    id:2, name:'Seiton', label:'2S — Ordenar', kanji:'整頓 · Un lugar para cada cosa',
    color:'var(--s2)', emoji:'🟡',
    items:[
      {text:'Cada elemento tiene un lugar designado claramente marcado',note:'Siluetas, marcas de piso, etiquetas'},
      {text:'Los elementos están ubicados según frecuencia de uso (FIFO)',note:'Los más usados más accesibles'},
      {text:'Las áreas de tránsito y emergencia están delimitadas y libres',note:'Pintura de piso, señalética'},
      {text:'Los estantes y gavetas tienen identificación visual clara',note:'Etiquetas, códigos de color'},
      {text:'El tiempo para encontrar cualquier herramienta es menor a 30 seg',note:'Prueba práctica recomendada'},
    ]
  },
  {
    id:3, name:'Seiso', label:'3S — Limpiar', kanji:'清掃 · Limpieza e inspección',
    color:'var(--s3)', emoji:'🧹',
    items:[
      {text:'El área de trabajo está libre de suciedad, polvo y residuos',note:'Pisos, máquinas, superficies'},
      {text:'Existe un calendario de limpieza definido con responsables',note:'Frecuencia: diaria/semanal/mensual'},
      {text:'Las fuentes de contaminación han sido identificadas y tratadas',note:'Fugas, derrames, generadores de residuos'},
      {text:'Las máquinas y equipos se limpian al inicio/fin de turno',note:'Verificar registros de limpieza'},
      {text:'Los implementos de limpieza están disponibles y en buen estado',note:'Escobas, trapos, aspiradoras'},
    ]
  },
  {
    id:4, name:'Seiketsu', label:'4S — Estandarizar', kanji:'清潔 · Mantener y estandarizar',
    color:'var(--s4)', emoji:'📋',
    items:[
      {text:'Existen estándares visuales (fotos, diagramas) del estado ideal',note:'One-point lessons, instrucciones visuales'},
      {text:'Los procedimientos de las 3S anteriores están documentados',note:'SOPs, instrucciones de trabajo'},
      {text:'Hay un sistema de auditoría interna periódica implementado',note:'Frecuencia mínima: mensual'},
      {text:'Los estándares son conocidos y aplicados por todo el personal',note:'Entrenamiento y verificación'},
      {text:'Las mejoras al estándar son revisadas y actualizadas regularmente',note:'Fecha de revisión en los documentos'},
    ]
  },
  {
    id:5, name:'Shitsuke', label:'5S — Disciplina', kanji:'躾 · Hábito y mejora continua',
    color:'var(--s5)', emoji:'🏆',
    items:[
      {text:'El personal aplica las 5S sin necesidad de supervisión constante',note:'Observar comportamiento espontáneo'},
      {text:'Existe un programa de reconocimiento por buenas prácticas 5S',note:'Incentivos, tablero de logros'},
      {text:'Los resultados de auditorías anteriores están publicados y visibles',note:'Tablero 5S en el área'},
      {text:'Se realizan reuniones periódicas de seguimiento 5S en el área',note:'Mínimo mensual con el equipo'},
      {text:'Hay evidencia de mejora continua respecto a auditorías anteriores',note:'Comparar puntajes históricos'},
    ]
  }
];

// Estado
const scores = {1:[],2:[],3:[],4:[],5:[]};
const obs    = {1:[],2:[],3:[],4:[],5:[]};

// Init scores
S5_DATA.forEach(s=>{
  scores[s.id] = new Array(s.items.length).fill(null);
  obs[s.id]    = new Array(s.items.length).fill('');
});

function buildAudit(){
  const body = document.getElementById('audit-body');
  body.innerHTML = '';

  S5_DATA.forEach(s=>{
    const sec = document.createElement('div');
    sec.className = 's-section';
    sec.id = 'sec-'+s.id;

    sec.innerHTML = `
      <div class="s-header" onclick="toggleSection(${s.id})">
        <div class="s-icon" style="background:color-mix(in srgb,${s.color} 15%,var(--surface2))">${s.emoji}</div>
        <div class="s-title-group">
          <div class="s-name">${s.label}</div>
          <div class="s-kanji">${s.kanji}</div>
        </div>
        <div class="s-score-badge" id="badge-${s.id}">0 / 20</div>
        <div class="s-chevron">▾</div>
      </div>
      <div class="s-body" id="body-${s.id}"></div>
    `;

    const bodyDiv = sec.querySelector('#body-'+s.id);
    s.items.forEach((item,i)=>{
      const row = document.createElement('div');
      row.className='item-row';
      row.innerHTML=`
        <div>
          <div class="item-text">${item.text}</div>
          <div class="item-note">${item.note}</div>
        </div>
        <div class="rating-btns" id="rb-${s.id}-${i}">
          <button class="r-btn" onclick="setScore(${s.id},${i},0)" title="0 - No existe">0</button>
          <button class="r-btn" onclick="setScore(${s.id},${i},1)" title="1 - Muy deficiente">1</button>
          <button class="r-btn" onclick="setScore(${s.id},${i},2)" title="2 - Regular">2</button>
          <button class="r-btn" onclick="setScore(${s.id},${i},3)" title="3 - Bueno">3</button>
          <button class="r-btn" onclick="setScore(${s.id},${i},4)" title="4 - Excelente">4</button>
        </div>
        <input class="obs-input" placeholder="Observación..." oninput="setObs(${s.id},${i},this.value)" value="">
      `;
      bodyDiv.appendChild(row);
    });

    body.appendChild(sec);
  });

  // Hallazgos
  const find = document.createElement('div');
  find.className='findings-section';
  find.id='findings-section';
  find.innerHTML=`<div class="findings-title">🔍 Hallazgos Detectados</div><div class="findings-grid" id="findings-grid"><div class="empty-findings">Los hallazgos aparecerán aquí cuando puntúes ítems con 0, 1 o 4</div></div>`;
  body.appendChild(find);
}

function toggleSection(id){
  document.getElementById('sec-'+id).classList.toggle('collapsed');
}

function setScore(sId,idx,val){
  scores[sId][idx]=val;
  // update buttons
  const rb=document.getElementById('rb-'+sId+'-'+idx);
  rb.querySelectorAll('.r-btn').forEach((b,i)=>{
    b.className='r-btn'+(i===val?' active-'+val:'');
  });
  updateScores();
  updateFindings();
}

function setObs(sId,idx,val){
  obs[sId][idx]=val;
  updateFindings();
}

function updateScores(){
  let total=0;
  S5_DATA.forEach(s=>{
    const pts=scores[s.id].reduce((a,v)=>a+(v===null?0:v),0);
    const max=s.items.length*4;
    total+=pts;
    document.getElementById('sv-'+s.id).textContent=pts;
    document.getElementById('sf-'+s.id).style.width=(pts/max*100)+'%';
    document.getElementById('badge-'+s.id).textContent=pts+' / '+max;
  });
  document.getElementById('sv-total').textContent=total;
  document.getElementById('sf-total').style.width=(total/100*100)+'%';
  document.getElementById('rb-total').textContent=total+' / 100';
  // Status
  const st=document.getElementById('rb-status');
  if(total>=90){st.style.cssText='background:rgba(63,185,80,.2);color:#3fb950';st.textContent='🏆 Excelente'}
  else if(total>=75){st.style.cssText='background:rgba(79,152,163,.2);color:#4f98a3';st.textContent='✔ Bueno'}
  else if(total>=60){st.style.cssText='background:rgba(210,153,34,.2);color:#d29922';st.textContent='⚠ Regular'}
  else if(total>=40){st.style.cssText='background:rgba(255,166,87,.2);color:#ffa657';st.textContent='⚠ Deficiente'}
  else if(total>0){st.style.cssText='background:rgba(248,81,73,.2);color:#f85149';st.textContent='✖ Crítico'}
  else{st.style.cssText='background:rgba(72,79,88,.3);color:#8b949e';st.textContent='Sin evaluar'}
}

function updateFindings(){
  const grid=document.getElementById('findings-grid');
  const items=[];
  S5_DATA.forEach(s=>{
    s.items.forEach((item,i)=>{
      const v=scores[s.id][i];
      const o=obs[s.id][i];
      if(v===null)return;
      if(v<=1){
        items.push({tag:'critical',label:'Crítico',text:item.text,s:s.label,obs:o});
      } else if(v===2){
        items.push({tag:'improvement',label:'Oportunidad',text:item.text,s:s.label,obs:o});
      } else if(v===4){
        items.push({tag:'good',label:'Buena práctica',text:item.text,s:s.label,obs:o});
      }
    });
  });
  if(!items.length){
    grid.innerHTML='<div class="empty-findings">Los hallazgos aparecerán aquí cuando puntúes ítems con 0, 1 o 4</div>';
    return;
  }
  grid.innerHTML=items.map(it=>`
    <div class="finding-card">
      <div class="finding-tag tag-${it.tag}">${it.label}</div>
      <div class="finding-text">${it.text}${it.obs?'<br><em style="color:var(--muted)">Obs: '+it.obs+'</em>':''}</div>
      <div class="finding-s">${it.s}</div>
    </div>
  `).join('');
}

function resetAudit(){
  if(!confirm('¿Resetear toda la auditoría? Se perderán los datos.'))return;
  S5_DATA.forEach(s=>{
    scores[s.id]=new Array(s.items.length).fill(null);
    obs[s.id]=new Array(s.items.length).fill('');
  });
  buildAudit();
  updateScores();
  updateFindings();
  ['meta-area','meta-auditor','meta-planta'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('meta-date').value='';
}

function scrollToFindings(){
  document.getElementById('findings-section').scrollIntoView({behavior:'smooth',block:'start'});
}

function exportCSV(){
  const area=document.getElementById('meta-area').value||'N/A';
  const aud=document.getElementById('meta-auditor').value||'N/A';
  const fecha=document.getElementById('meta-date').value||new Date().toISOString().slice(0,10);
  const turno=document.getElementById('meta-turno').value;
  const planta=document.getElementById('meta-planta').value||'N/A';

  let csv='Área,Auditor,Fecha,Turno,Planta\n';
  csv+=`"${area}","${aud}","${fecha}","${turno}","${planta}"\n\n`;
  csv+='S,Criterio,Puntuación,Observación\n';

  S5_DATA.forEach(s=>{
    s.items.forEach((item,i)=>{
      const v=scores[s.id][i];
      const o=obs[s.id][i]||'';
      csv+=`"${s.name}","${item.text}","${v===null?'N/E':v}","${o}"\n`;
    });
    const pts=scores[s.id].reduce((a,v)=>a+(v===null?0:v),0);
    csv+=`"${s.name} TOTAL","Subtotal ${s.name}","${pts}/20",""\n`;
  });

  const total=S5_DATA.reduce((a,s)=>a+scores[s.id].reduce((b,v)=>b+(v===null?0:v),0),0);
  csv+=`\n"TOTAL GENERAL","Puntuación 5S","${total}/100",""\n`;

  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`5S_Auditoria_${area.replace(/\s/g,'_')}_${fecha}.csv`;a.click();
  URL.revokeObjectURL(url);
}

// Init
document.getElementById('meta-date').value=new Date().toISOString().slice(0,10);
buildAudit();
</script>
