<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagrama Ishikawa — Lean Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
      --text:#e6edf3;--muted:#8b949e;--faint:#484f58;
      --accent:#4f98a3;--green:#3fb950;--warn:#d29922;--danger:#f85149;
      --purple:#bc8cff;--orange:#ffa657;
      --c1:#4f98a3;--c2:#3fb950;--c3:#d29922;--c4:#bc8cff;--c5:#ffa657;--c6:#f85149;
      --radius:12px;--radius-sm:8px;
    }
    html{scroll-behavior:smooth}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

    /* NAV */
    .topnav{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:54px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-shrink:0}
    .brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;text-decoration:none;color:var(--text)}
    .brand-icon{font-family:'Instrument Serif',serif;font-size:22px;color:var(--accent)}
    .nav-links{display:flex;gap:4px}
    .nav-link{padding:6px 13px;border-radius:var(--radius-sm);font-size:13px;color:var(--muted);text-decoration:none;transition:all .18s}
    .nav-link:hover,.nav-link.active{background:var(--surface2);color:var(--text)}
    .nav-actions{display:flex;gap:8px}
    .btn{padding:7px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .18s;font-family:inherit}
    .btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#3a7f8a}
    .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-ghost:hover{background:var(--surface2);color:var(--text)}
    .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--border)}.btn-danger:hover{background:rgba(248,81,73,.1)}

    /* LAYOUT */
    .main-layout{display:flex;flex:1;overflow:hidden;height:calc(100vh - 54px)}

    /* SIDEBAR */
    .sidebar{width:320px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
    .sb-header{padding:16px 20px;border-bottom:1px solid var(--border)}
    .sb-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px}
    .problem-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:var(--radius-sm);font-size:14px;font-family:inherit;font-weight:600;outline:none;resize:none;transition:border-color .18s}
    .problem-input:focus{border-color:var(--accent)}
    .sb-scroll{flex:1;overflow-y:auto;padding:12px 0}
    .sb-scroll::-webkit-scrollbar{width:4px}.sb-scroll::-webkit-scrollbar-track{background:transparent}.sb-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

    /* CATEGORY BLOCKS */
    .cat-block{border-bottom:1px solid var(--border)}
    .cat-header{display:flex;align-items:center;gap:10px;padding:12px 20px;cursor:pointer;user-select:none;transition:background .15s}
    .cat-header:hover{background:var(--surface2)}
    .cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .cat-name{font-size:13px;font-weight:700;flex:1}
    .cat-count{font-size:11px;color:var(--muted);background:var(--surface2);padding:2px 7px;border-radius:99px}
    .cat-chevron{font-size:12px;color:var(--muted);transition:transform .22s}
    .cat-block.collapsed .cat-chevron{transform:rotate(-90deg)}
    .cat-body{padding:8px 20px 12px}
    .cat-block.collapsed .cat-body{display:none}

    .cause-item{display:flex;align-items:center;gap:8px;padding:4px 0}
    .cause-text{flex:1;font-size:12px;color:var(--text);background:transparent;border:none;outline:none;font-family:inherit;padding:4px 8px;border-radius:6px;transition:background .15s}
    .cause-text:hover{background:var(--surface2)}
    .cause-text:focus{background:var(--surface2);outline:1px solid var(--border)}
    .cause-del{width:22px;height:22px;border-radius:4px;border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
    .cause-del:hover{background:rgba(248,81,73,.15);color:var(--danger)}
    .cause-add{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;border:1px dashed var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;width:100%;margin-top:4px;transition:all .18s;font-family:inherit}
    .cause-add:hover{border-color:var(--c,var(--accent));color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 5%,transparent)}

    /* CANVAS */
    .canvas-area{flex:1;overflow:hidden;position:relative;background:var(--bg)}
    #ishi-svg{width:100%;height:100%;display:block}

    /* TOOLBAR sobre canvas */
    .canvas-toolbar{position:absolute;bottom:16px;right:16px;display:flex;gap:8px}
    .ct-btn{padding:8px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted);transition:all .18s;font-family:inherit}
    .ct-btn:hover{background:var(--surface2);color:var(--text)}
    .ct-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .ct-btn.primary:hover{background:#3a7f8a}

    /* MODAL exportar */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
    .modal-overlay.open{opacity:1;pointer-events:all}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;width:480px;max-width:90vw}
    .modal-title{font-size:15px;font-weight:700;margin-bottom:16px}
    .modal-row{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
    .modal-row label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
    .modal-row input,.modal-row textarea{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;outline:none;transition:border-color .18s}
    .modal-row input:focus,.modal-row textarea:focus{border-color:var(--accent)}
    .modal-row textarea{resize:vertical;min-height:80px}
    .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

    /* HINT */
    .canvas-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--faint);pointer-events:none;font-size:13px;line-height:2}
    .canvas-hint.hidden{display:none}

    @media(max-width:768px){
      .sidebar{width:260px}
      .topnav .nav-links{display:none}
    }
  </style>
</head>
<body>

<nav class="topnav">
  <a class="brand" href="index.html"><span class="brand-icon">⧡</span><span>Lean <strong>Suite</strong></span></a>
  <div class="nav-links">
    <a class="nav-link" href="index.html">🏠 Inicio</a>
    <a class="nav-link" href="vsm.html">🗺️ VSM</a>
    <a class="nav-link" href="5s.html">🧹 5S</a>
    <a class="nav-link active" href="ishikawa.html">🐟 Ishikawa</a>
    <a class="nav-link" href="caso-negocio.html">📋 Caso</a>
    <a class="nav-link" href="a3-report.html">📄 A3</a>
    <a class="nav-link" href="pdca.html">🔄 PDCA</a>
  </div>
  <div class="nav-actions">
    <button class="btn btn-ghost" onclick="resetDiagram()">🔄 Nuevo</button>
    <button class="btn btn-ghost" onclick="openExportModal()">⬇ Exportar</button>
    <button class="btn btn-primary" onclick="exportSVG()">🖼️ SVG</button>
  </div>
</nav>

<div class="main-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sb-header">
      <div class="sb-title">🟥 Efecto / Problema</div>
      <textarea class="problem-input" id="problem-input" rows="2" placeholder="Describe el problema o efecto no deseado..."
        oninput="renderDiagram()">Defectos en producto terminado</textarea>
    </div>
    <div class="sb-scroll" id="cat-list"></div>
  </aside>

  <!-- CANVAS -->
  <div class="canvas-area">
    <div class="canvas-hint" id="canvas-hint">🐟 Agrega causas en el panel izquierdo<br>El diagrama se actualizará automáticamente</div>
    <svg id="ishi-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="canvas-toolbar">
      <button class="ct-btn" onclick="zoomOut()">&#x2212; Zoom</button>
      <button class="ct-btn" onclick="zoomReset()">Reset</button>
      <button class="ct-btn" onclick="zoomIn()">+ Zoom</button>
      <button class="ct-btn primary" onclick="exportSVG()">🖼️ SVG</button>
    </div>
  </div>

</div>

<!-- MODAL EXPORTAR -->
<div class="modal-overlay" id="export-modal">
  <div class="modal">
    <div class="modal-title">⬇ Exportar Diagrama</div>
    <div class="modal-row"><label>Título del reporte</label><input id="exp-title" value="Diagrama Ishikawa"></div>
    <div class="modal-row"><label>Analista</label><input id="exp-analyst" placeholder="Nombre del analista"></div>
    <div class="modal-row"><label>Fecha</label><input id="exp-date" type="date"></div>
    <div class="modal-row"><label>Notas adicionales</label><textarea id="exp-notes" placeholder="Observaciones, contexto, acciones..."></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeExportModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="exportCSV()">⬇ Exportar CSV</button>
      <button class="btn btn-primary" onclick="exportSVG();closeExportModal()">🖼️ Exportar SVG</button>
    </div>
  </div>
</div>

<script>
// =====================
// DATOS
// =====================
const CATEGORIES = [
  { id:'maquina',  name:'Máquina',      emoji:'⚙️', color:'#4f98a3', causes:['Mantenimiento deficiente','Calibración incorrecta'] },
  { id:'mano',     name:'Mano de Obra', emoji:'👷', color:'#3fb950', causes:['Falta de capacitación','Alta rotación'] },
  { id:'metodo',   name:'Método',       emoji:'📍', color:'#d29922', causes:['Procedimientos no documentados','SOPs desactualizados'] },
  { id:'material', name:'Material',     emoji:'📦', color:'#bc8cff', causes:['Materia prima fuera de especificación','Proveedor no calificado'] },
  { id:'medio',    name:'Medio Ambiente',emoji:'🌡️', color:'#ffa657', causes:['Temperatura variable','Humedad elevada'] },
  { id:'medicion', name:'Medición',     emoji:'📏', color:'#f85149', causes:['Instrumentos no calibrados','Error de lectura'] },
];

let scale = 1;
let translateX = 0, translateY = 0;
let isDragging = false, dragStart = {x:0,y:0,tx:0,ty:0};

// =====================
// BUILD SIDEBAR
// =====================
function buildSidebar() {
  const list = document.getElementById('cat-list');
  list.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const block = document.createElement('div');
    block.className = 'cat-block';
    block.id = 'catblock-' + cat.id;

    const causeRows = cat.causes.map((c,i) => `
      <div class="cause-item">
        <span class="cat-dot" style="background:${cat.color};flex-shrink:0"></span>
        <input class="cause-text" value="${escHtml(c)}" placeholder="Causa..." title="${escHtml(c)}"
          onchange="updateCause('${cat.id}',${i},this.value)"
          onblur="updateCause('${cat.id}',${i},this.value)">
        <button class="cause-del" onclick="removeCause('${cat.id}',${i})" title="Eliminar">×</button>
      </div>
    `).join('');

    block.innerHTML = `
      <div class="cat-header" onclick="toggleCat('${cat.id}')">
        <div class="cat-dot" style="background:${cat.color}"></div>
        <div class="cat-name">${cat.emoji} ${cat.name}</div>
        <div class="cat-count">${cat.causes.length}</div>
        <div class="cat-chevron">▾</div>
      </div>
      <div class="cat-body" id="catbody-${cat.id}">
        ${causeRows}
        <button class="cause-add" style="--c:${cat.color}" onclick="addCause('${cat.id}')">
          + Agregar causa
        </button>
      </div>
    `;
    list.appendChild(block);
  });
}

function toggleCat(id){
  document.getElementById('catblock-'+id).classList.toggle('collapsed');
}

function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function updateCause(catId, idx, val){
  const cat = CATEGORIES.find(c=>c.id===catId);
  if(cat) { cat.causes[idx]=val; renderDiagram(); }
}

function addCause(catId){
  const cat = CATEGORIES.find(c=>c.id===catId);
  if(cat){ cat.causes.push('Nueva causa'); buildSidebar(); renderDiagram();
    // focus last input in that category
    setTimeout(()=>{
      const inputs = document.querySelectorAll('#catbody-'+catId+' .cause-text');
      if(inputs.length) inputs[inputs.length-1].focus();
    },50);
  }
}

function removeCause(catId,idx){
  const cat=CATEGORIES.find(c=>c.id===catId);
  if(cat){ cat.causes.splice(idx,1); buildSidebar(); renderDiagram(); }
}

// =====================
// RENDER SVG
// =====================
function renderDiagram(){
  const svg = document.getElementById('ishi-svg');
  const problem = document.getElementById('problem-input').value.trim() || 'Problema';
  const W = svg.clientWidth || 900;
  const H = svg.clientHeight || 500;

  const totalCauses = CATEGORIES.reduce((a,c)=>a+c.causes.length,0);
  document.getElementById('canvas-hint').classList.toggle('hidden', totalCauses > 0);

  // Layout
  const spineY   = H / 2;
  const headX    = W - 60;
  const spineStartX = 80;
  const spineEndX   = headX - 140;
  const boxW = 160, boxH = 50;

  // Top 3 categories (left to right on top)
  const topCats = [CATEGORIES[0], CATEGORIES[2], CATEGORIES[4]];
  const botCats = [CATEGORIES[1], CATEGORIES[3], CATEGORIES[5]];
  const ribPositions = [
    spineStartX + (spineEndX-spineStartX)*0.18,
    spineStartX + (spineEndX-spineStartX)*0.50,
    spineStartX + (spineEndX-spineStartX)*0.82,
  ];

  let markup = `<g id="diagram-g" transform="translate(${translateX},${translateY}) scale(${scale})">`;

  // ---- SPINE ----
  markup += `<line x1="${spineStartX}" y1="${spineY}" x2="${spineEndX}" y2="${spineY}" stroke="#e6edf3" stroke-width="3" stroke-linecap="round"/>`;

  // ---- ARROW HEAD ----
  markup += `<polygon points="${spineEndX},${spineY} ${spineEndX-18},${spineY-9} ${spineEndX-18},${spineY+9}" fill="#e6edf3"/>`;

  // ---- EFFECT BOX ----
  const ebX = headX - boxW/2 + 10;
  const ebY = spineY - boxH/2;
  markup += `
    <rect x="${ebX}" y="${ebY}" width="${boxW}" height="${boxH}" rx="8" fill="#f85149" opacity=".9"/>
    <text x="${ebX+boxW/2}" y="${ebY+18}" text-anchor="middle" fill="#fff" font-size="11" font-weight="700" font-family="Inter,sans-serif">EFECTO</text>
    ${wrapText(problem, ebX+boxW/2, ebY+34, boxW-16, 12, '#fff')}
  `;

  // ---- RIBS ----
  function drawCauses(cat, ribX, isTop){
    const ribLen = H * 0.22;
    const ribStartY = isTop ? spineY - ribLen : spineY + ribLen;
    const ribEndY   = spineY;
    const angle     = isTop ? -45 : 45;
    const dx = Math.cos((angle*Math.PI)/180)*ribLen;
    const dy = Math.sin((angle*Math.PI)/180)*ribLen;
    const ribStartActualX = ribX - dx;
    const ribStartActualY = ribY => ribY;

    // Rib line
    markup += `<line x1="${ribX - dx}" y1="${ribStartY}" x2="${ribX}" y2="${spineY}" stroke="${cat.color}" stroke-width="2" stroke-linecap="round" opacity=".8"/>`;

    // Category label
    const labelX = ribX - dx;
    const labelY = isTop ? ribStartY - 24 : ribStartY + 36;
    markup += `
      <rect x="${labelX-54}" y="${isTop?labelY-20:labelY-16}" width="108" height="28" rx="6" fill="${cat.color}" opacity=".15"/>
      <text x="${labelX}" y="${isTop?labelY-2:labelY+4}" text-anchor="middle" fill="${cat.color}" font-size="12" font-weight="700" font-family="Inter,sans-serif">${cat.emoji} ${cat.name}</text>
    `;

    // Sub-causes (small branches off the rib)
    const maxCauses = Math.min(cat.causes.length, 6);
    for(let i=0;i<maxCauses;i++){
      const t = (i+1)/(maxCauses+1);
      const bx = ribX - dx + t*dx;
      const by = ribStartY + t*(spineY - ribStartY);
      const branchLen = 60;
      const bEndX = isTop ? bx - branchLen*0.7 : bx - branchLen*0.7;
      const bEndY = isTop ? by - branchLen : by + branchLen;

      markup += `<line x1="${bx}" y1="${by}" x2="${bEndX}" y2="${bEndY}" stroke="${cat.color}" stroke-width="1.5" stroke-linecap="round" opacity=".6"/>`;

      const text = cat.causes[i] || '';
      const textY = isTop ? bEndY - 6 : bEndY + 14;
      markup += `<text x="${bEndX}" y="${textY}" text-anchor="middle" fill="#e6edf3" font-size="10" font-family="Inter,sans-serif" opacity=".9">${escSvg(truncate(text,22))}</text>`;
    }
    if(cat.causes.length > 6){
      const t = 0.95;
      const bx = ribX - dx + t*dx;
      const by = ribStartY + t*(spineY - ribStartY);
      markup += `<text x="${bx+6}" y="${isTop?by-4:by+12}" fill="${cat.color}" font-size="10" font-family="Inter,sans-serif" opacity=".7">+${cat.causes.length-6} más</text>`;
    }
  }

  ribPositions.forEach((ribX,i)=>{
    drawCauses(topCats[i], ribX, true);
    drawCauses(botCats[i], ribX, false);
  });

  markup += '</g>';
  svg.innerHTML = markup;
  setupDrag();
}

function truncate(s,n){ return s.length>n?s.slice(0,n-1)+'…':s; }
function escSvg(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function wrapText(text, cx, y, maxW, fs, fill){
  const words = text.split(' ');
  let line = '', lines = [], approxCharW = fs*0.6;
  const maxChars = Math.floor(maxW/approxCharW);
  words.forEach(w=>{
    if((line+w).length>maxChars && line){ lines.push(line.trim()); line=''; }
    line+=w+' ';
  });
  if(line.trim()) lines.push(line.trim());
  lines = lines.slice(0,2);
  return lines.map((l,i)=>`<text x="${cx}" y="${y+i*(fs+3)}" text-anchor="middle" fill="${fill}" font-size="${fs}" font-family="Inter,sans-serif">${escSvg(l)}</text>`).join('');
}

// =====================
// ZOOM & PAN
// =====================
function zoomIn(){ scale=Math.min(scale+0.15,3); renderDiagram(); }
function zoomOut(){ scale=Math.max(scale-0.15,0.3); renderDiagram(); }
function zoomReset(){ scale=1; translateX=0; translateY=0; renderDiagram(); }

function setupDrag(){
  const svg = document.getElementById('ishi-svg');
  svg.onmousedown = e=>{ if(e.button!==0)return; isDragging=true; dragStart={x:e.clientX,y:e.clientY,tx:translateX,ty:translateY}; svg.style.cursor='grabbing'; };
  svg.onmousemove = e=>{ if(!isDragging)return; translateX=dragStart.tx+(e.clientX-dragStart.x)/scale; translateY=dragStart.ty+(e.clientY-dragStart.y)/scale; renderDiagram(); };
  svg.onmouseup = svg.onmouseleave = ()=>{ isDragging=false; svg.style.cursor='grab'; };
  svg.onwheel = e=>{ e.preventDefault(); const delta=e.deltaY>0?-0.1:0.1; scale=Math.max(0.3,Math.min(3,scale+delta)); renderDiagram(); };
  svg.style.cursor='grab';
}

// =====================
// EXPORT
// =====================
function exportSVG(){
  const problem = document.getElementById('problem-input').value.trim() || 'ishikawa';
  const svgEl = document.getElementById('ishi-svg');
  const svgStr = '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" style="background:#0d1117;font-family:sans-serif">\n' +
    svgEl.innerHTML + '</svg>';
  const blob = new Blob([svgStr],{type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`Ishikawa_${problem.replace(/\s+/g,'_').slice(0,30)}.svg`; a.click();
  URL.revokeObjectURL(url);
}

function openExportModal(){
  document.getElementById('exp-date').value=new Date().toISOString().slice(0,10);
  document.getElementById('export-modal').classList.add('open');
}
function closeExportModal(){ document.getElementById('export-modal').classList.remove('open'); }

function exportCSV(){
  const title    = document.getElementById('exp-title').value||'Diagrama Ishikawa';
  const analyst  = document.getElementById('exp-analyst').value||'N/A';
  const fecha    = document.getElementById('exp-date').value||new Date().toISOString().slice(0,10);
  const notes    = document.getElementById('exp-notes').value||'';
  const problem  = document.getElementById('problem-input').value||'Sin definir';

  let csv=`Título,"${title}"\nAnalista,"${analyst}"\nFecha,"${fecha}"\nEfecto/Problema,"${problem}"\nNotas,"${notes}"\n\nCategoría (6M),Causa\n`;
  CATEGORIES.forEach(cat=>{
    cat.causes.forEach(c=>{
      csv+=`"${cat.name}","${c}"\n`;
    });
  });

  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`Ishikawa_${(problem||'diagrama').replace(/\s+/g,'_').slice(0,30)}.csv`; a.click();
  URL.revokeObjectURL(url);
  closeExportModal();
}

function resetDiagram(){
  if(!confirm('¿Crear nuevo diagrama? Se borrarán las causas actuales.'))return;
  CATEGORIES.forEach(cat=>{ cat.causes=[]; });
  document.getElementById('problem-input').value='';
  buildSidebar();
  renderDiagram();
}

// INIT
// =====================
document.getElementById('exp-date').value = new Date().toISOString().slice(0,10);
buildSidebar();
window.addEventListener('resize', renderDiagram);
setTimeout(renderDiagram, 100);
</script>
