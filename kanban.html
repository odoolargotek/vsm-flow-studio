<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanban — Largotek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;--faint:#3d444d;
  --green:#3fb950;--yellow:#d29922;--red:#f85149;--blue:#58a6ff;--purple:#bc8cff;
  --radius:12px
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap;gap:8px;flex-shrink:0}
.topbar-brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none}
.topbar-brand span{color:var(--green)}
.topbar-right{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:7px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .17s}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn-primary{background:var(--green);color:#0d1117;border-color:var(--green)}
.btn-primary:hover{opacity:.88;color:#0d1117}
.btn-danger:hover{border-color:var(--red);color:var(--red)}
.saved-lbl{font-size:11px;color:var(--muted)}

/* HERO */
.hero{padding:24px 28px 16px;max-width:1400px;margin:0 auto;width:100%}
.hero-eye{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin-bottom:6px}
.hero h1{font-family:'Instrument Serif',serif;font-size:clamp(1.3rem,2.5vw,1.9rem);margin-bottom:4px}
.hero-sub{font-size:12.5px;color:var(--muted);line-height:1.65}

/* STATS BAR */
.stats-bar{display:flex;gap:10px;padding:0 28px 16px;max-width:1400px;margin:0 auto;width:100%;flex-wrap:wrap}
.stat-chip{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 16px;text-align:center;min-width:90px}
.stat-chip .sv{font-size:17px;font-weight:800;color:var(--text)}
.stat-chip .sl{font-size:9.5px;color:var(--muted);margin-top:1px;letter-spacing:.04em;text-transform:uppercase}

/* FILTERS */
.filters{display:flex;gap:8px;padding:0 28px 14px;max-width:1400px;margin:0 auto;width:100%;flex-wrap:wrap;align-items:center}
.filter-label{font-size:11px;color:var(--muted);font-weight:600}
.filter-select{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:5px 10px;font-size:12px;color:var(--text);font-family:'Inter',sans-serif;cursor:pointer}
.filter-select:focus{outline:none;border-color:var(--green)}
.filter-input{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:5px 10px;font-size:12px;color:var(--text);font-family:'Inter',sans-serif;width:160px}
.filter-input:focus{outline:none;border-color:var(--green)}
.filter-input::placeholder{color:var(--faint)}

/* BOARD */
.board-wrap{flex:1;overflow-x:auto;padding:0 28px 40px;max-width:1400px;margin:0 auto;width:100%}
.board{display:flex;gap:14px;min-width:900px;align-items:flex-start}

/* COLUMN */
.col{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:220px;flex-shrink:0;display:flex;flex-direction:column;max-height:calc(100vh - 260px);overflow:hidden}
.col-head{padding:12px 14px 10px;border-bottom:1px solid var(--border);background:var(--surface2);flex-shrink:0}
.col-title-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:4px}
.col-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.col-title{font-size:12px;font-weight:700;letter-spacing:.04em}
.col-count-badge{background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:1px 8px;font-size:10px;font-weight:700;color:var(--muted)}
.col-count-badge.wip-warn{background:rgba(248,81,73,.15);border-color:rgba(248,81,73,.4);color:var(--red)}
.wip-bar{height:3px;border-radius:99px;background:var(--faint);overflow:hidden;margin-top:6px}
.wip-fill{height:100%;border-radius:99px;transition:width .3s,background .3s}
.col-cards{flex:1;overflow-y:auto;padding:10px 10px 6px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.col-cards::-webkit-scrollbar{width:4px}
.col-cards::-webkit-scrollbar-thumb{background:var(--faint);border-radius:99px}
.col-footer{padding:8px 10px;border-top:1px solid var(--faint);flex-shrink:0}
.add-card-btn{width:100%;padding:6px;border-radius:7px;border:1px dashed var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .17s;text-align:center}
.add-card-btn:hover{border-color:var(--green);color:var(--green)}

/* CARDS */
.card{
  background:var(--surface2);border:1px solid var(--border);border-radius:9px;
  padding:11px 12px;cursor:grab;transition:all .18s;
  position:relative;border-left:3px solid transparent;
}
.card:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.card.dragging{opacity:.45;transform:rotate(2deg);cursor:grabbing}
.card.drag-over{border-color:var(--green);background:rgba(63,185,80,.07)}
.card.hidden{display:none}
.card-priority-strip{
  position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:9px 0 0 9px;
}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:6px}
.card-title-text{font-size:12.5px;font-weight:700;line-height:1.35;flex:1;word-break:break-word}
.card-menu-btn{background:none;border:none;color:var(--faint);cursor:pointer;font-size:14px;padding:0 2px;transition:color .15s;flex-shrink:0}
.card-menu-btn:hover{color:var(--text)}
.card-desc{font-size:11px;color:var(--muted);line-height:1.55;margin-bottom:7px;word-break:break-word}
.card-footer-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px}
.priority-badge{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.p-critical{background:rgba(248,81,73,.2);color:var(--red)}
.p-high{background:rgba(210,153,34,.2);color:var(--yellow)}
.p-medium{background:rgba(88,166,255,.2);color:var(--blue)}
.p-low{background:rgba(63,185,80,.2);color:var(--green)}
.card-resp{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:3px}
.card-resp-avatar{width:18px;height:18px;border-radius:50%;background:var(--faint);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--text);flex-shrink:0}
.card-due{font-size:10px;color:var(--muted)}
.card-due.overdue{color:var(--red);font-weight:700}
.card-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.card-tag{font-size:9px;padding:1px 6px;border-radius:99px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}

/* DROP ZONE */
.col-cards.drag-active{background:rgba(63,185,80,.04);border-radius:8px;border:1px dashed rgba(63,185,80,.3)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:24px}
.modal h3{font-family:'Instrument Serif',serif;font-size:1.2rem;margin-bottom:18px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:13px;color:var(--text);font-family:'Inter',sans-serif;transition:border-color .17s;width:100%}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--green)}
.field input::placeholder,.field textarea::placeholder{color:var(--faint)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e3a2e;border:1px solid var(--green);color:var(--green);padding:9px 20px;border-radius:99px;font-size:12.5px;font-weight:600;opacity:0;transition:all .3s;z-index:200;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* PRINT */
@media print{
  .topbar,.btn,.add-card-btn,.card-menu-btn,.filters,.stats-bar{display:none!important}
  body{background:#fff;color:#111}
  .col{background:#fff;border-color:#ccc;max-height:none}
  .col-head{background:#f5f5f5}
  .card{background:#f9f9f9;border-color:#ccc;page-break-inside:avoid}
  .board{flex-wrap:wrap}
  .col{width:48%;margin-bottom:16px}
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <a href="index.html" class="topbar-brand">← <span>Largotek</span> Lean Suite</a>
  <div class="topbar-right">
    <span class="saved-lbl" id="saved-lbl"></span>
    <button class="btn" onclick="exportCSV()">📥 CSV</button>
    <button class="btn btn-danger" onclick="clearAll()">🗑 Limpiar</button>
    <button class="btn" onclick="saveLocal()">💾 Guardar</button>
    <button class="btn btn-primary" onclick="openModal(null,null)">+ Nueva Tarjeta</button>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-eye">🃏 Kanban / Pull System — Largotek Lean Suite</div>
  <h1>Tablero Kanban</h1>
  <p class="hero-sub">Sistema de jalar (Pull System). Gestiona tareas de mejora arrastrando tarjetas entre columnas. Controla el WIP, prioridades y responsables para cada acción del proyecto.</p>
</div>

<!-- STATS -->
<div class="stats-bar" id="stats-bar"></div>

<!-- FILTERS -->
<div class="filters">
  <span class="filter-label">Filtrar:</span>
  <select class="filter-select" id="f-prioridad" onchange="applyFilters()">
    <option value="">Todas las prioridades</option>
    <option value="critica">🔴 Crítica</option>
    <option value="alta">🟡 Alta</option>
    <option value="media">🔵 Media</option>
    <option value="baja">🟢 Baja</option>
  </select>
  <input class="filter-input" id="f-resp" placeholder="🔍 Responsable..." oninput="applyFilters()">
  <input class="filter-input" id="f-texto" placeholder="🔍 Buscar tarjeta..." oninput="applyFilters()">
  <button class="btn" onclick="clearFilters()">Limpiar filtros</button>
</div>

<!-- BOARD -->
<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <h3 id="modal-title">➕ Nueva Tarjeta</h3>
    <div class="modal-grid">
      <div class="field full"><label>Título *</label><input id="f-titulo" placeholder="Ej: Reducir tiempo de espera en Est. 3"></div>
      <div class="field full"><label>Descripción</label><textarea id="f-desc" style="min-height:64px" placeholder="Detalle de la tarea o acción de mejora..."></textarea></div>
      <div class="field"><label>Prioridad</label>
        <select id="f-prio">
          <option value="media">Media</option>
          <option value="alta">Alta</option>
          <option value="critica">Crítica</option>
          <option value="baja">Baja</option>
        </select>
      </div>
      <div class="field"><label>Columna</label>
        <select id="f-col"></select>
      </div>
      <div class="field"><label>Responsable</label><input id="f-responsable" placeholder="Nombre del responsable"></div>
      <div class="field"><label>Fecha límite</label><input id="f-fecha" type="date"></div>
      <div class="field full"><label>Etiquetas (separadas por coma)</label><input id="f-tags" placeholder="Ej: SMED, Est.3, Urgente"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveCard()">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY = 'largotek_kanban';

const COLS = [
  {id:'backlog',   title:'Backlog',      dot:'#484f58', wip:0},
  {id:'todo',      title:'Por Hacer',    dot:'#58a6ff', wip:5},
  {id:'doing',     title:'En Proceso',   dot:'#d29922', wip:3},
  {id:'review',    title:'Revisión',     dot:'#bc8cff', wip:3},
  {id:'done',      title:'Completado',   dot:'#3fb950', wip:0},
];

const PRIO_META = {
  critica: {label:'Crítica', cls:'p-critical', color:'var(--red)', order:0},
  alta:    {label:'Alta',    cls:'p-high',     color:'var(--yellow)', order:1},
  media:   {label:'Media',   cls:'p-medium',   color:'var(--blue)', order:2},
  baja:    {label:'Baja',    cls:'p-low',      color:'var(--green)', order:3},
};

let cards = [];
let editId = null;
let dragCardId = null;
let nextId = 1;

/* ── RENDER ── */
function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  COLS.forEach(col => {
    const colCards = cards.filter(c => c.col === col.id);
    const wip = col.wip;
    const overWip = wip > 0 && colCards.length > wip;
    const wipPct = wip > 0 ? Math.min(colCards.length / wip * 100, 100) : 0;
    const wipColor = overWip ? 'var(--red)' : wipPct > 80 ? 'var(--yellow)' : 'var(--green)';

    const colEl = document.createElement('div');
    colEl.className = 'col';
    colEl.dataset.col = col.id;

    colEl.innerHTML = `
      <div class="col-head">
        <div class="col-title-row">
          <div style="display:flex;align-items:center;gap:7px">
            <div class="col-dot" style="background:${col.dot}"></div>
            <span class="col-title">${col.title}</span>
          </div>
          <span class="col-count-badge${overWip?' wip-warn':''}"
            title="${wip>0?colCards.length+'/'+wip+' WIP':colCards.length+' tarjetas'}">
            ${colCards.length}${wip > 0 ? '/'+wip : ''}
          </span>
        </div>
        ${wip > 0 ? `<div class="wip-bar"><div class="wip-fill" style="width:${wipPct}%;background:${wipColor}"></div></div>` : ''}
      </div>
      <div class="col-cards" id="cards-${col.id}"
        ondragover="onDragOver(event,'${col.id}')"
        ondragleave="onDragLeave(event,'${col.id}')"
        ondrop="onDrop(event,'${col.id}')">
      </div>
      <div class="col-footer">
        <button class="add-card-btn" onclick="openModal(null,'${col.id}')">+ Agregar</button>
      </div>`;
    board.appendChild(colEl);

    // Render cards
    const zone = document.getElementById('cards-' + col.id);
    colCards.forEach(card => {
      const pm = PRIO_META[card.prio] || PRIO_META.media;
      const today = new Date().toISOString().slice(0,10);
      const overdue = card.fecha && card.fecha < today && col.id !== 'done';
      const tags = (card.tags||'').split(',').map(t=>t.trim()).filter(Boolean);
      const initials = (card.responsable||'').split(' ').map(w=>w[0]||'').slice(0,2).join('').toUpperCase() || '?';

      const el = document.createElement('div');
      el.className = 'card';
      el.dataset.id = card.id;
      el.draggable = true;
      el.style.borderLeftColor = pm.color;
      el.innerHTML = `
        <div class="card-header">
          <div class="card-title-text">${esc(card.title)}</div>
          <button class="card-menu-btn" onclick="openModal(${card.id},null)" title="Editar">✏️</button>
        </div>
        ${card.desc ? `<div class="card-desc">${esc(card.desc)}</div>` : ''}
        <div class="card-footer-row">
          <span class="priority-badge ${pm.cls}">${pm.label}</span>
          ${card.responsable ? `<div class="card-resp"><div class="card-resp-avatar">${esc(initials)}</div><span>${esc(card.responsable.split(' ')[0])}</span></div>` : ''}
        </div>
        ${card.fecha ? `<div class="card-due${overdue?' overdue':''}" style="margin-top:5px">${overdue?'⚠️':'🗓️'} ${card.fecha}${overdue?' — Vencida':''}</div>` : ''}
        ${tags.length ? `<div class="card-tags">${tags.map(t=>`<span class="card-tag">${esc(t)}</span>`).join('')}</div>` : ''}
        <div style="margin-top:7px;display:flex;justify-content:flex-end">
          <button class="btn" style="font-size:10px;padding:3px 8px;border-color:transparent;color:var(--faint)" onclick="deleteCard(${card.id})">✕ Eliminar</button>
        </div>`;

      el.addEventListener('dragstart', e => onDragStart(e, card.id));
      el.addEventListener('dragend', onDragEnd);
      zone.appendChild(el);
    });
  });

  renderStats();
  applyFilters();
  autoSave();
}

/* ── STATS ── */
function renderStats() {
  const total = cards.length;
  const done = cards.filter(c=>c.col==='done').length;
  const doing = cards.filter(c=>c.col==='doing').length;
  const critical = cards.filter(c=>c.prio==='critica'&&c.col!=='done').length;
  const today = new Date().toISOString().slice(0,10);
  const overdue = cards.filter(c=>c.fecha&&c.fecha<today&&c.col!=='done').length;
  const pct = total>0?Math.round(done/total*100):0;
  document.getElementById('stats-bar').innerHTML = [
    {v:total, l:'Total Tarjetas'},
    {v:doing, l:'En Proceso'},
    {v:done+' ('+pct+'%)', l:'Completadas'},
    {v:critical, l:'Críticas Activas'},
    {v:overdue, l:'Vencidas'},
  ].map(s=>`<div class="stat-chip"><div class="sv">${s.v}</div><div class="sl">${s.l}</div></div>`).join('');
}

/* ── DRAG & DROP ── */
function onDragStart(e, id) {
  dragCardId = id;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(()=>{ const el=document.querySelector('[data-id="'+id+'"]'); if(el) el.classList.add('dragging'); },0);
}
function onDragEnd() {
  document.querySelectorAll('.card').forEach(el=>el.classList.remove('dragging'));
  document.querySelectorAll('.col-cards').forEach(el=>el.classList.remove('drag-active'));
  dragCardId=null;
}
function onDragOver(e, colId) {
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  document.getElementById('cards-'+colId).classList.add('drag-active');
}
function onDragLeave(e, colId) {
  document.getElementById('cards-'+colId).classList.remove('drag-active');
}
function onDrop(e, colId) {
  e.preventDefault();
  document.getElementById('cards-'+colId).classList.remove('drag-active');
  if(dragCardId===null) return;
  const card = cards.find(c=>c.id===dragCardId);
  if(card) {
    const prevCol = card.col;
    card.col = colId;
    if(colId==='done' && !card.doneAt) card.doneAt = new Date().toISOString().slice(0,10);
    if(prevCol==='done' && colId!=='done') card.doneAt = null;
    showToast('✓ Movida a “'+COLS.find(c=>c.id===colId).title+'”');
    render();
  }
}

/* ── MODAL ── */
function openModal(id, colId) {
  editId = id;
  const overlay = document.getElementById('modal-overlay');
  // Populate column select
  const colSel = document.getElementById('f-col');
  colSel.innerHTML = COLS.map(c=>`<option value="${c.id}">${c.title}</option>`).join('');

  if(id !== null) {
    const card = cards.find(c=>c.id===id);
    if(!card) return;
    document.getElementById('modal-title').textContent = '✏️ Editar Tarjeta';
    document.getElementById('f-titulo').value = card.title||'';
    document.getElementById('f-desc').value = card.desc||'';
    document.getElementById('f-prio').value = card.prio||'media';
    colSel.value = card.col;
    document.getElementById('f-responsable').value = card.responsable||'';
    document.getElementById('f-fecha').value = card.fecha||'';
    document.getElementById('f-tags').value = card.tags||'';
  } else {
    document.getElementById('modal-title').textContent = '➕ Nueva Tarjeta';
    document.getElementById('f-titulo').value='';
    document.getElementById('f-desc').value='';
    document.getElementById('f-prio').value='media';
    colSel.value = colId || 'backlog';
    document.getElementById('f-responsable').value='';
    document.getElementById('f-fecha').value='';
    document.getElementById('f-tags').value='';
  }
  overlay.classList.add('open');
  document.getElementById('f-titulo').focus();
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function closeModalOutside(e) { if(e.target===document.getElementById('modal-overlay')) closeModal(); }

function saveCard() {
  const title = document.getElementById('f-titulo').value.trim();
  if(!title){ document.getElementById('f-titulo').focus(); return; }
  if(editId !== null) {
    const card = cards.find(c=>c.id===editId);
    if(card) {
      card.title = title;
      card.desc = document.getElementById('f-desc').value.trim();
      card.prio = document.getElementById('f-prio').value;
      card.col = document.getElementById('f-col').value;
      card.responsable = document.getElementById('f-responsable').value.trim();
      card.fecha = document.getElementById('f-fecha').value;
      card.tags = document.getElementById('f-tags').value.trim();
    }
    showToast('✓ Tarjeta actualizada');
  } else {
    cards.push({
      id: nextId++,
      title,
      desc: document.getElementById('f-desc').value.trim(),
      prio: document.getElementById('f-prio').value,
      col: document.getElementById('f-col').value,
      responsable: document.getElementById('f-responsable').value.trim(),
      fecha: document.getElementById('f-fecha').value,
      tags: document.getElementById('f-tags').value.trim(),
      createdAt: new Date().toISOString().slice(0,10),
      doneAt: null,
    });
    showToast('✓ Tarjeta creada');
  }
  closeModal();
  render();
}

function deleteCard(id) {
  if(!confirm('¿Eliminar esta tarjeta?')) return;
  cards = cards.filter(c=>c.id!==id);
  render();
  showToast('🗑 Tarjeta eliminada');
}

/* ── FILTERS ── */
function applyFilters() {
  const prio = document.getElementById('f-prioridad').value;
  const resp = document.getElementById('f-resp').value.toLowerCase();
  const texto = document.getElementById('f-texto').value.toLowerCase();
  document.querySelectorAll('.card').forEach(el => {
    const card = cards.find(c=>c.id===parseInt(el.dataset.id));
    if(!card){el.classList.remove('hidden');return;}
    const show =
      (!prio || card.prio===prio) &&
      (!resp || (card.responsable||'').toLowerCase().includes(resp)) &&
      (!texto || (card.title+' '+(card.desc||'')).toLowerCase().includes(texto));
    el.classList.toggle('hidden', !show);
  });
}
function clearFilters() {
  ['f-prioridad','f-resp','f-texto'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  applyFilters();
}

/* ── CSV ── */
function exportCSV() {
  let csv='ID,Título,Descripción,Prioridad,Columna,Responsable,Fecha Límite,Etiquetas,Creado,Completado\n';
  cards.forEach(c=>{
    const colName = COLS.find(x=>x.id===c.col)?.title||c.col;
    const pName = PRIO_META[c.prio]?.label||c.prio;
    csv+=`${c.id},"${esc2(c.title)}","${esc2(c.desc)}",${pName},${colName},"${esc2(c.responsable)}",${c.fecha||''},"${esc2(c.tags)}",${c.createdAt||''},${c.doneAt||''}\n`;
  });
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='kanban-largotek.csv'; a.click();
}

/* ── PERSIST ── */
let saveTimer;
function autoSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveLocal,1000);}
function saveLocal(){
  localStorage.setItem(KEY,JSON.stringify({cards,nextId,ts:new Date().toISOString()}));
  const t=new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
  const el=document.getElementById('saved-lbl'); if(el) el.textContent='✓ Guardado '+t;
}
function loadLocal(){
  const raw=localStorage.getItem(KEY);
  if(!raw){loadDemo();return;}
  try{
    const d=JSON.parse(raw);
    cards=d.cards||[]; nextId=d.nextId||cards.length+1;
    if(d.ts){const el=document.getElementById('saved-lbl');if(el)el.textContent='Último guardado: '+new Date(d.ts).toLocaleString('es',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
    render();
  }catch(e){loadDemo();}
}

function clearAll(){if(!confirm('¿Limpiar todo el tablero Kanban?'))return;localStorage.removeItem(KEY);location.reload();}

/* ── UTILS ── */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function esc2(s){return String(s||'').replace(/"/g,'\"');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

document.addEventListener('keydown',e=>{if(e.key==='Escape') closeModal();});
window.addEventListener('load',loadLocal);
