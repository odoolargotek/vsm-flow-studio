<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gráfica de Control SPC — Lean Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
      --text:#e6edf3;--muted:#8b949e;--faint:#484f58;
      --accent:#4f98a3;--green:#3fb950;--warn:#d29922;--danger:#f85149;
      --purple:#bc8cff;--orange:#ffa657;
      --radius:12px;--radius-sm:8px;
      --trans:180ms cubic-bezier(.16,1,.3,1);
    }
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    .topnav{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:54px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
    .brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;text-decoration:none;color:var(--text)}
    .brand-icon{font-family:'Instrument Serif',serif;font-size:22px;color:var(--accent)}
    .nav-links{display:flex;gap:4px}
    .nav-link{padding:6px 13px;border-radius:var(--radius-sm);font-size:13px;color:var(--muted);text-decoration:none;transition:all var(--trans)}
    .nav-link:hover,.nav-link.active{background:var(--surface2);color:var(--text)}
    .nav-actions{display:flex;gap:8px}
    .btn{padding:7px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all var(--trans);font-family:inherit}
    .btn-primary{background:var(--danger);color:#fff}.btn-primary:hover{background:#d93830}
    .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-ghost:hover{background:var(--surface2);color:var(--text)}

    .app{display:flex;flex:1;overflow:hidden;height:calc(100vh - 54px)}

    /* SIDEBAR */
    .sidebar{width:320px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
    .sb-head{padding:16px 20px 12px;border-bottom:1px solid var(--border)}
    .sb-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
    .field{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
    .field label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
    .field input,.field select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;outline:none;transition:border-color var(--trans);width:100%}
    .field input:focus,.field select:focus{border-color:var(--accent)}
    .sb-body{flex:1;overflow-y:auto;padding:12px 20px}
    .sb-body::-webkit-scrollbar{width:4px}.sb-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
    .obs-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .obs-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
    .add-btn{font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;border:1px dashed var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all var(--trans);font-family:inherit}
    .add-btn:hover{border-color:var(--accent);color:var(--accent)}
    .obs-row{display:flex;gap:6px;align-items:center;margin-bottom:5px}
    .obs-num{font-size:10px;color:var(--faint);width:18px;flex-shrink:0;text-align:right}
    .obs-input{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:6px;font-size:12px;font-family:inherit;outline:none;transition:border-color var(--trans)}
    .obs-input:focus{border-color:var(--accent)}
    .obs-input.out{border-color:var(--danger);background:rgba(248,81,73,.06)}
    .obs-del{width:22px;height:22px;border-radius:4px;border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all var(--trans);flex-shrink:0}
    .obs-del:hover{background:rgba(248,81,73,.15);color:var(--danger)}
    .sb-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px}
    .sb-foot .btn{flex:1;font-size:12px;padding:8px}

    /* MAIN */
    .main{flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:20px}
    .main::-webkit-scrollbar{width:6px}.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

    /* STATS */
    .stats-row{display:flex;gap:12px;flex-wrap:wrap}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;flex:1;min-width:110px}
    .stat-card .sv{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
    .stat-card .sl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:2px}

    /* CHART */
    .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px}
    .chart-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px}
    .chart-title{font-size:13px;font-weight:700}
    .chart-sub{font-size:11px;color:var(--muted);margin-top:3px}
    .legend{display:flex;gap:14px;flex-wrap:wrap}
    .leg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
    .leg-dot{width:10px;height:3px;border-radius:99px}
    canvas{display:block;width:100%!important}

    /* SIGNALS TABLE */
    .signals-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
    .signals-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .signals-title{font-size:13px;font-weight:700}
    .out-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(248,81,73,.15);color:var(--danger)}
    table{width:100%;border-collapse:collapse}
    thead th{padding:9px 16px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;border-bottom:1px solid var(--border)}
    tbody tr{border-bottom:1px solid var(--border);transition:background var(--trans)}
    tbody tr:last-child{border-bottom:none}
    tbody tr:hover{background:var(--surface2)}
    tbody td{padding:9px 16px;font-size:12px}
  </style>
</head>
<body>
<nav class="topnav">
  <a class="brand" href="index.html"><span class="brand-icon">⬡</span><span>Lean <strong>Suite</strong></span></a>
  <div class="nav-links">
    <a class="nav-link" href="index.html">🏠 Inicio</a>
    <a class="nav-link" href="vsm.html">🗺️ VSM</a>
    <a class="nav-link" href="pareto.html">📊 Pareto</a>
    <a class="nav-link" href="oee.html">⚙️ OEE</a>
    <a class="nav-link active" href="spc.html">📉 SPC</a>
  </div>
  <div class="nav-actions">
    <button class="btn btn-ghost" onclick="loadDemo()">🧪 Demo</button>
    <button class="btn btn-ghost" onclick="exportCSV()">⬇ CSV</button>
    <button class="btn btn-primary" onclick="renderAll()">▶ Calcular</button>
  </div>
</nav>

<div class="app">
  <aside class="sidebar">
    <div class="sb-head">
      <div class="sb-title">📉 Configuración SPC</div>
      <div class="field"><label>Variable / Característica</label><input id="cfg-name" value="Diámetro (mm)" oninput="renderAll()"></div>
      <div class="field"><label>Tipo de Gráfica</label>
        <select id="cfg-type" onchange="renderAll()">
          <option value="x">Gráfica X̄ (medias)</option>
          <option value="i">Gráfica I (individuales)</option>
        </select>
      </div>
      <div class="field"><label>Sigma (σ) para límites</label>
        <select id="cfg-sigma" onchange="renderAll()">
          <option value="3" selected>3σ (99.73%)</option>
          <option value="2">2σ (95.44%)</option>
          <option value="1">1σ (68.27%)</option>
        </select>
      </div>
    </div>
    <div class="sb-body">
      <div class="obs-title">
        <span class="obs-label">Observaciones</span>
        <button class="add-btn" onclick="addObs()">+ Agregar</button>
      </div>
      <div id="obs-list"></div>
    </div>
    <div class="sb-foot">
      <button class="btn btn-ghost" onclick="clearObs()">🗑 Limpiar</button>
      <button class="btn btn-primary" onclick="renderAll()">▶ Calcular</button>
    </div>
  </aside>

  <main class="main">
    <div class="stats-row" id="stats-row"></div>
    <div class="chart-card">
      <div class="chart-hd">
        <div>
          <div class="chart-title" id="chart-title">Gráfica de Control</div>
          <div class="chart-sub" id="chart-sub"></div>
        </div>
        <div class="legend">
          <div class="leg-item"><div class="leg-dot" style="background:#f85149"></div>UCL/LCL</div>
          <div class="leg-item"><div class="leg-dot" style="background:#d29922"></div>CL (Media)</div>
          <div class="leg-item"><div class="leg-dot" style="background:#4f98a3"></div>Datos</div>
          <div class="leg-item"><div class="leg-dot" style="background:#f85149;width:8px;height:8px;border-radius:50%"></div>Fuera de control</div>
        </div>
      </div>
      <canvas id="spc-chart" height="280"></canvas>
    </div>
    <div class="signals-card">
      <div class="signals-head">
        <span class="signals-title">⚠️ Señales Fuera de Control</span>
        <span class="out-badge" id="out-count">—</span>
      </div>
      <table><thead><tr><th>#</th><th>Punto</th><th>Valor</th><th>UCL</th><th>LCL</th><th>Desviación</th><th>Estado</th></tr></thead>
      <tbody id="signals-body"></tbody></table>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
let observations = [];
let chartInst = null;

function newObs(v=''){ return {id:Date.now()+Math.random(), val:v}; }

function loadDemo(){
  const vals = [10.1,10.3,9.9,10.2,10.0,10.4,9.8,10.1,10.5,10.0,9.7,10.2,11.2,10.1,9.9,10.3,10.0,10.2,9.8,10.1,10.6,10.0,10.3,9.5,10.2];
  observations = vals.map(v=>newObs(v));
  document.getElementById('cfg-name').value='Diámetro (mm)';
  renderSidebar();
  renderAll();
}

function renderSidebar(){
  const list = document.getElementById('obs-list');
  list.innerHTML = observations.map((o,i)=>{
    const v = parseFloat(o.val);
    const stats = window._lastStats;
    const out = stats && !isNaN(v) && (v > stats.ucl || v < stats.lcl);
    return `
      <div class="obs-row">
        <span class="obs-num">${i+1}</span>
        <input class="obs-input${out?' out':''}" value="${o.val}" type="number" step="any"
          oninput="observations[${i}].val=this.value;renderAll()">
        <button class="obs-del" onclick="removeObs(${i})">×</button>
      </div>`;
  }).join('');
}

function addObs(){
  observations.push(newObs(''));
  renderSidebar();
  setTimeout(()=>{ const ins=document.querySelectorAll('.obs-input'); if(ins.length) ins[ins.length-1].focus(); },30);
}

function removeObs(i){ observations.splice(i,1); renderSidebar(); renderAll(); }
function clearObs(){ if(confirm('¿Limpiar observaciones?')){ observations=[]; renderSidebar(); renderAll(); } }

function computeStats(){
  const vals = observations.map(o=>parseFloat(o.val)).filter(v=>!isNaN(v));
  if(vals.length < 2) return null;
  const n = vals.length;
  const mean = vals.reduce((s,v)=>s+v,0)/n;
  const variance = vals.reduce((s,v)=>s+(v-mean)**2,0)/(n-1);
  const std = Math.sqrt(variance);
  const sigma = +document.getElementById('cfg-sigma').value || 3;
  const ucl = mean + sigma*std;
  const lcl = mean - sigma*std;
  return {vals, n, mean, std, ucl, lcl, sigma};
}

function renderAll(){
  const stats = computeStats();
  window._lastStats = stats;
  renderSidebar();
  if(!stats){ clearChart(); return; }
  renderStats(stats);
  renderChart(stats);
  renderSignals(stats);
  document.getElementById('chart-title').textContent = (document.getElementById('cfg-name').value||'Variable') + ' — Gráfica de Control';
  document.getElementById('chart-sub').textContent = `${stats.n} observaciones · σ=${stats.sigma} · Media=${stats.mean.toFixed(4)}`;
}

function renderStats(s){
  const outPts = s.vals.filter(v=>v>s.ucl||v<s.lcl).length;
  const cp = (s.ucl-s.lcl)/(6*s.std);
  document.getElementById('stats-row').innerHTML=`
    <div class="stat-card"><div class="sv">${s.n}</div><div class="sl">N observaciones</div></div>
    <div class="stat-card"><div class="sv">${s.mean.toFixed(4)}</div><div class="sl">Media (X̄)</div></div>
    <div class="stat-card"><div class="sv">${s.std.toFixed(4)}</div><div class="sl">Desv. Estándar (σ)</div></div>
    <div class="stat-card"><div class="sv" style="color:#f85149">${s.ucl.toFixed(4)}</div><div class="sl">UCL</div></div>
    <div class="stat-card"><div class="sv" style="color:#f85149">${s.lcl.toFixed(4)}</div><div class="sl">LCL</div></div>
    <div class="stat-card" style="border-color:${outPts>0?'var(--danger)':'var(--border)'};background:${outPts>0?'rgba(248,81,73,.06)':''}">
      <div class="sv" style="color:${outPts>0?'var(--danger)':'var(--green)'}">${outPts}</div>
      <div class="sl">Fuera de Control</div></div>
    <div class="stat-card"><div class="sv">${isFinite(cp)?cp.toFixed(3):'—'}</div><div class="sl">Cp (capacidad)</div></div>
  `;
}

function renderChart(s){
  const ctx = document.getElementById('spc-chart').getContext('2d');
  if(chartInst){chartInst.destroy();chartInst=null;}
  const labels = s.vals.map((_,i)=>i+1);
  const pointColors = s.vals.map(v=>(v>s.ucl||v<s.lcl)?'#f85149':'#4f98a3');
  const pointRadius = s.vals.map(v=>(v>s.ucl||v<s.lcl)?7:4);
  chartInst = new Chart(ctx,{
    type:'line',
    data:{
      labels,
      datasets:[
        {label:'UCL',data:s.vals.map(()=>s.ucl),borderColor:'rgba(248,81,73,.7)',borderDash:[6,4],borderWidth:1.5,pointRadius:0,fill:false},
        {label:'LCL',data:s.vals.map(()=>s.lcl),borderColor:'rgba(248,81,73,.7)',borderDash:[6,4],borderWidth:1.5,pointRadius:0,fill:false},
        {label:'CL',data:s.vals.map(()=>s.mean),borderColor:'rgba(210,153,34,.8)',borderDash:[4,3],borderWidth:1.5,pointRadius:0,fill:false},
        {label:document.getElementById('cfg-name').value||'Variable',data:s.vals,borderColor:'#4f98a3',borderWidth:2,pointBackgroundColor:pointColors,pointRadius:pointRadius,pointHoverRadius:7,tension:.3,fill:false}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:true,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{labels:{color:'#8b949e',font:{size:11},filter:i=>i.text!=='UCL'&&i.text!=='LCL'&&i.text!=='CL'}},
        tooltip:{backgroundColor:'#21262d',borderColor:'#30363d',borderWidth:1,titleColor:'#e6edf3',bodyColor:'#8b949e',
          callbacks:{label:c=>{
            if(c.dataset.label==='UCL') return ` UCL: ${c.parsed.y.toFixed(4)}`;
            if(c.dataset.label==='LCL') return ` LCL: ${c.parsed.y.toFixed(4)}`;
            if(c.dataset.label==='CL')  return ` CL: ${c.parsed.y.toFixed(4)}`;
            const out = c.parsed.y>s.ucl||c.parsed.y<s.lcl;
            return ` ${c.dataset.label}: ${c.parsed.y.toFixed(4)}${out?' ⚠️ FUERA':''}`;
          }}
        }
      },
      scales:{
        x:{ticks:{color:'#8b949e',font:{size:11}},grid:{color:'rgba(48,54,61,.5)'},title:{display:true,text:'Muestra #',color:'#8b949e',font:{size:10}}},
        y:{ticks:{color:'#8b949e',font:{size:11}},grid:{color:'rgba(48,54,61,.5)'},title:{display:true,text:document.getElementById('cfg-name').value||'Valor',color:'#8b949e',font:{size:10}}}
      }
    }
  });
}

function renderSignals(s){
  const tbody = document.getElementById('signals-body');
  const badge = document.getElementById('out-count');
  const out = s.vals.map((v,i)=>({i:i+1,v,out:v>s.ucl||v<s.lcl})).filter(p=>p.out);
  badge.textContent = out.length ? `${out.length} señales detectadas` : '✅ Proceso en control';
  badge.style.background = out.length ? 'rgba(248,81,73,.15)' : 'rgba(63,185,80,.15)';
  badge.style.color = out.length ? 'var(--danger)' : 'var(--green)';
  if(!out.length){
    tbody.innerHTML='<tr><td colspan="7" style="text-align:center;color:var(--green);padding:20px">✅ Todas las observaciones dentro de los límites de control</td></tr>';
    return;
  }
  tbody.innerHTML = out.map(p=>`
    <tr>
      <td>${p.i}</td>
      <td>Muestra ${p.i}</td>
      <td style="color:var(--danger);font-weight:700">${p.v.toFixed(4)}</td>
      <td>${s.ucl.toFixed(4)}</td>
      <td>${s.lcl.toFixed(4)}</td>
      <td style="color:var(--danger)">${p.v>s.ucl?'+':'-'}${Math.abs(p.v-(p.v>s.ucl?s.ucl:s.lcl)).toFixed(4)}</td>
      <td style="color:var(--danger);font-weight:700">${p.v>s.ucl?'↑ Sobre UCL':'↓ Bajo LCL'}</td>
    </tr>
  `).join('');
}

function clearChart(){
  if(chartInst){chartInst.destroy();chartInst=null;}
  document.getElementById('stats-row').innerHTML='';
  document.getElementById('chart-sub').textContent='';
  document.getElementById('signals-body').innerHTML='';
  document.getElementById('out-count').textContent='—';
}

function exportCSV(){
  const stats = window._lastStats;
  if(!stats){ alert('Calcula primero.'); return; }
  const name = document.getElementById('cfg-name').value||'Variable';
  let csv=`Variable,"${name}"\nMedia,${stats.mean.toFixed(6)}\nDesv.Std,${stats.std.toFixed(6)}\nUCL,${stats.ucl.toFixed(6)}\nLCL,${stats.lcl.toFixed(6)}\n\nMuestra,Valor,Estado\n`;
  stats.vals.forEach((v,i)=>{
    csv+=`${i+1},${v},${(v>stats.ucl||v<stats.lcl)?'Fuera de Control':'En Control'}\n`;
  });
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='SPC_Control_Chart.csv';a.click();
}

loadDemo();
</script>
</body>
</html>
